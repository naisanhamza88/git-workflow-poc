name: build
on:
  pull_request:
  push:
    branches: [develop, staging, preprod, production]
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulated build with traceability info
        run: |
          echo "BUILD_BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "BUILD_COMMIT=$GITHUB_SHA"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
          ls -la
