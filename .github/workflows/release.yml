name: release
on:
  pull_request:
    types: [closed]
    branches: [production]
permissions:
  contents: write
jobs:
  tag-and-release:
    if: github.event.pull_request.merged == true && (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD: ${{ github.head_ref }}
      SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Annotated tag + GitHub Release
        run: |
          VERSION="${HEAD#*/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$SHA" -m "Release $VERSION (from $HEAD)"
          git push origin "$VERSION"
          gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes
