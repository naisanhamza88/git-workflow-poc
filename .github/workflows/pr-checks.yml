name: pr-checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate source -> target
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          V='v[0-9]+\.[0-9]+\.[0-9]+'
          ok=false
          case "$BASE" in
            production|staging|preprod) [[ "$HEAD" =~ ^(release|hotfix)/$V$ ]] && ok=true ;;
            develop) [[ "$HEAD" =~ ^(feature/[A-Z]+-[0-9]+-[a-z0-9-]+|release/$V|hotfix/$V)$ ]] && ok=true ;;
            release/*) [[ "$HEAD" =~ ^bugfix/[A-Z]+-[0-9]+-[a-z0-9-]+$ ]] && ok=true ;;
            feature/*) [[ "$HEAD" =~ ^feature/ ]] && ok=true ;;
            *) ok=true ;;
          esac
          if [ "$ok" != true ]; then
            echo "::error::'$HEAD' is not allowed to merge into '$BASE' (see Git Workflow Plan > Branching Model)."
            exit 1
          fi
          echo "Allowed."
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title: $TITLE"
          if [[ ! "$TITLE" =~ ^(feat|fix|refactor|chore|docs|test)\(([A-Z]+-[0-9]+|release|hotfix)\):\ .+ ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(MAL-123): add appointments list'"
            exit 1
          fi
